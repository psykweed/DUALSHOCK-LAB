<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - DUALSHOCK-LAB</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="inventario.css">
</head>

<body>

    <nav class="sidebar">
        <h2>🎮<br>DUALSHOCK-LAB</h2>
        <div class="menu">
            <a href="../dashboard/dashboard.html">Inicio</a>
            <a href="../productos/ingresoProducto.html">Ingresar producto</a>
            <a href="../inventario/inventario.html" class="activo">Inventario</a>
            <a href="../servicios/servicios.html">Servicios</a>
            <a href="../agendamientos/agendamientos.html">Agendamientos</a>
            <a href="../login/login.html" id="cerrarSesion">Cerrar sesión</a>
        </div>
    </nav>

    <main class="contenido">
        <h1>Inventario</h1>
        <p>Revisa el stock, busca productos y ajusta cantidades</p>

        <div class="contenedorCards">
            <div class="card">
                <div class="cardInfo">
                    <h3>Productos distintos</h3>
                    <p id="totalProductos">0</p>
                </div>
            </div>
            <div class="card">
                <div class="cardInfo">
                    <h3>Unidades en stock</h3>
                    <p id="totalUnidades">0</p>
                </div>
            </div>
            <div class="card">
                <div class="cardInfo">
                    <h3>Con stock bajo</h3>
                    <p id="totalBajos">0</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="barraFiltros">
                <input type="text" id="buscador" placeholder="Buscar por nombre o SKU">
                <select id="filtroCategoria">
                    <option value="">Todas las categorías</option>
                    <option value="Consolas">Consolas</option>
                    <option value="Computadores">Computadores</option>
                    <option value="Componentes">Componentes</option>
                    <option value="Accesorios">Accesorios</option>
                </select>
                <button class="botonGuardar" type="button" id="botonIngreso">Ingresar producto</button>
            </div>

            <div class="tablaScroll">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>SKU</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="inventario.js"></script>
</body>

</html>
