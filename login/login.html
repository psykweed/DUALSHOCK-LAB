<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DUALSHOCK-LAB</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="pantallaDividida">

        <div class="panelMarca">
            <div class="logo">🎮 DUALSHOCK-LAB</div>
            <h1>Inventario y servicios para consolas y computadores</h1>
            <p>Controla el stock de componentes, consolas y accesorios desde un solo panel.</p>
        </div>

        <div class="panelFormulario">
            <form class="card formulariostyle" id="formulario">
                <h2>Iniciar sesión</h2>
                <p class="subtitulo">Ingresa con tu usuario</p>

                <div class="campo">
                    <label for="usuarioLogin">Usuario</label>
                    <input type="text" id="usuarioLogin" placeholder="Nombre de usuario">
                </div>

                <div class="campo">
                    <label for="passwordLogin">Contraseña</label>
                    <input type="password" id="passwordLogin">
                </div>

                <button class="botonGuardar" type="submit">Ingresar</button>

                <p class="textoPie">¿No tienes cuenta? <a href="../registro/registro.html">Regístrate</a></p>
            </form>
        </div>

    </div>
    <script src="login.js"></script>
</body>

</html>
