<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - DUALSHOCK-LAB</title>
    
 
    <!-- conexion con css de servicio -->
    <link rel="stylesheet" href="/css/servicios.css">
</head>
<body>
    <header class="navbar">
        <div class="tituloNav"></div>
        <nav class="menu">
            <a href="index.html">Salir</a> 
        </nav>
    </header>
    <main style="padding: 40px; max-width: 800px; margin: 0 auto;">
        <h1>Gestión de Servicios Técnicos DUALSHOCK-LAB (PRECIOS REALESs)</h1>
        <!-- aqui es  para agregar servicios -->
        <form id="formServicio" class="formulariostyle">
            <div class="fila">
                <label for="nombreSelect" style="font-weight: bold; margin-bottom: 5px; display: block;"
                >Mantención para consolas y computadores y cambio de piezas etc</label>
                <select id="nombreSelect" required>
        <option value="" disabled selected>Seleccione un servicio...</option>
                <option value="Mantención consola (Pasta térmica) - $25.000">Mantención consola (Pasta térmica + a domicilio) - $25.000</option>
  <option value="Mantención PS5 (Metal líquido) - $55.000">Mantención PS5 (Metal líquido + a domicilio) - $55.000</option>
 <option value="Mantención PC/Notebook Básico - $30.000">Mantención PC/Notebook Básico (CPU/GPU + a domicilio) - $30.000</option>
  <option value="Mantención PC/Notebook Full - $45.000">Mantención PC/Notebook Full (CPU/GPU + a domicilio) - $45.000</option>
  <option value="Cambio de Disco Duro 1TB - $60.000">Cambio Disco Duro 1TB (Instalación + Configuración + a domicilio) - $60.000</option>
<option value="Cambio HDMI PS4 - $50.000">Cambio HDMI PS4 (Con maquinaria, retiro/entrega 48 hrs) - $50.000</option>
   <option value="Cambio HDMI PS5 - $65.000">Cambio HDMI PS5 (Con maquinaria, retiro/entrega 48 hrs) - $65.000</option>
  <option value="Mantención consola + Lector - $30.000">Mantención consola + Lector (Pasta térmica + diag. lector) - $30.000</option>
<option value="Formateo Notebook/PC - $20.000">Formateo Notebook/PC - $20.000</option>
                </select>
            </div>
            <div class="botones">
                <button type="submit" class="botonGuardar">Guardar Servicio</button>
            </div>
        </form>

        <br><br>

        <!--  AQUI CREAMOS LA TABLA PARA MOSTRAR LOS SERVICIOS GUARDADOS -->
        <h2>Servicios Registrados</h2>
        <table border="1" style="width: 100%; text-align: left; border-collapse: collapse; background-color: white;">
            <thead style="background-color: #2563eb; color: white;">
                <tr>
                    <th style="padding: 10px;">Nombre</th>
                    <th style="padding: 10px;">Precio</th>
                    <th style="padding: 10px;">Duración</th>
                    <th style="padding: 10px;">servicio registrado :</th>
                </tr>
            </thead>
            <tbody id="tabladeservicios">
                
            </tbody>
        </table>

    </main>

    <!-- javascript-->
    <script src="/servicios/servicios.js"></script>

</body>
</html>
