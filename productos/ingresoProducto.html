<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de producto - DUALSHOCK-LAB</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="ingresoProducto.css">
</head>

<body>

    <nav class="sidebar">
        <h2>🎮<br>DUALSHOCK-LAB</h2>
        <div class="menu">
            <a href="../dashboard/dashboard.html">Inicio</a>
            <a href="../productos/ingresoProducto.html" class="activo">Ingresar producto</a>
            <a href="../inventario/inventario.html">Inventario</a>
            <a href="../servicios/servicios.html">Servicios</a>
            <a href="../agendamientos/agendamientos.html">Agendamientos</a>
            <a href="../login/login.html" id="cerrarSesion">Cerrar sesión</a>
        </div>
    </nav>

    <main class="contenido">
        <h1>Ingreso de producto</h1>
        <p>Registra un producto nuevo en el inventario</p>

        <form class="card formularioProducto" id="formulario">

            <div class="fila">
                <div class="campo">
                    <label for="nombreProducto">Nombre</label>
                    <input type="text" id="nombreProducto" placeholder="Tarjeta de video RTX 4060">
                </div>
                <div class="campo">
                    <label for="skuProducto">SKU</label>
                    <input type="text" id="skuProducto" placeholder="GPU-4060-03">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="categoriaSelect">Categoría</label>
                    <select id="categoriaSelect">
                        <option value="">Seleccione categoría</option>
                        <option value="Consolas">Consolas</option>
                        <option value="Computadores">Computadores</option>
                        <option value="Componentes">Componentes</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="cantidadProducto">Cantidad</label>
                    <input type="number" id="cantidadProducto">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="precioProducto">Precio</label>
                    <input type="number" id="precioProducto">
                </div>
            </div>

            <div class="botones">
                <button class="botonGuardar" type="submit">Guardar</button>
                <button class="botonSecundario" type="button" id="botonVolver">Volver al dashboard</button>
            </div>

        </form>
    </main>

    <script src="ingresoProducto.js"></script>
</body>

</html>
