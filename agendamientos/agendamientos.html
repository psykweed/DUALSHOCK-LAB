<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamientos - DUALSHOCK-LAB</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="agendamientos.css">
</head>

<body>

    <nav class="sidebar">
        <h2>🎮<br>DUALSHOCK-LAB</h2>
        <div class="menu">
            <a href="../dashboard/dashboard.html">Inicio</a>
            <a href="../productos/ingresoProducto.html">Ingresar producto</a>
            <a href="../inventario/inventario.html">Inventario</a>
            <a href="../servicios/servicios.html">Servicios</a>
            <a href="../agendamientos/agendamientos.html" class="activo">Agendamientos</a>
            <a href="../login/login.html" id="cerrarSesion">Cerrar sesión</a>
        </div>
    </nav>

    <main class="contenido">
        <h1>Agendamientos</h1>
        <p>Reserva una hora de atención. Atendemos de lunes a viernes, de 10:00 a 18:00 (bloques de 1 hora)</p>

        <form class="card formularioAgendamiento" id="formulario">

            <div class="fila">
                <div class="campo">
                    <label for="nombreCliente">Cliente</label>
                    <input type="text" id="nombreCliente" placeholder="Ana Pérez">
                </div>
                <div class="campo">
                    <label for="correoCliente">Correo electrónico</label>
                    <input type="text" id="correoCliente" placeholder="ana@correo.cl">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="servicioSelect">Servicio</label>
                    <select id="servicioSelect"></select>
                </div>
                <div class="campo">
                    <label for="fechaCita">Fecha</label>
                    <input type="date" id="fechaCita">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="horaSelect">Hora</label>
                    <select id="horaSelect"></select>
                </div>
            </div>

            <p id="mensajeAgendamiento"></p>

            <div class="botones">
                <button class="botonGuardar" type="submit">Reservar hora</button>
                <button class="botonSecundario" type="button" id="botonVolver">Volver al dashboard</button>
            </div>

        </form>

        <div class="card listaAgendamientos">
            <h2>Citas registradas</h2>
            <p class="textoSecundario" id="mensajeVacio">Aún no hay citas registradas</p>
            <div class="tablaCitas" id="contenedorTabla">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Cliente</th>
                            <th>Correo</th>
                            <th>Servicio</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAgendamientos"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="agendamientos.js"></script>
</body>

</html>
